name: Stage 2 Palabra gateway candidate
on:
  pull_request:
    paths:
      - 'gateway_stage2/**'
      - 'tests/test_stage2_gateway.py'
      - 'GATEWAY_STAGE2_PALABRA.md'
      - '.github/workflows/stage2-gateway.yml'
  push:
    branches:
      - feature/stage2-palabra-gateway-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dedicated gateway test environment
        run: python -m pip install -r gateway_stage2/requirements.txt pytest httpx ruff
      - name: Compile gateway Python
        run: python -m compileall -q gateway_stage2 tests/test_stage2_gateway.py
      - name: Stage 2 static checks
        run: ruff check gateway_stage2 tests/test_stage2_gateway.py --select E4,E7,E9,F
      - name: Stage 2 gateway tests
        run: python -m pytest -q tests/test_stage2_gateway.py
