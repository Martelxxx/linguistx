name: Passenger v95 source CI
# DEVNOTE: CI is a release gate, not production acceptance. Keep no-network invariants and security scans mandatory.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      # Review and pin third-party action SHA in the actual Git repository.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the explicit ASGI runtime and test dependencies
        run: python -m pip install -e '.[quality]'
      - name: Compile Python
        run: python -m compileall -q .
      - name: Strict lint for hardened passenger modules
        run: ruff check runtime_security.py app_logging.py passenger_asgi.py integration_bridge.py fixture_gateway.py shared_guest_store.py local_service_setup.py quality/verify_v80.py --select E4,E7,E9,F
      - name: Run passenger regression and engineering boundaries
        run: python -m pytest -q tests
      - name: Baseline and security assertions
        run: python quality/verify_repository.py
      - name: Python security scan (report; review findings before release)
        run: bandit -r . -x ./tests -ll
      - name: Dependency advisory scan
        run: python -m pip_audit
